apiVersion: apps/v1
kind: Deployment

metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: model-serving

  template:
    metadata:
      labels:
        app: model-serving

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: CHECKPOINT_PATH
              value: /app/checkpoints/classifier_v1.pt

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc